apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: argocd-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: nginx
          image: madhurmas1705/argocd-demo:1.0.0
          ports:
            - containerPort: 80
